<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="운동 다이어리">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f6f6f8">

    <title>운동 기록 및 인바디 다이어리</title>
    
    <link rel="apple-touch-icon" href="https://fav.farm/🏋️">
    <link rel="icon" href="https://fav.farm/🏋️">

    <!-- Supabase 및 Chart.js 필수 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f6f6f8; 
            --container-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            --border-main: #ebebef; 
            --color-pt: #a0a0a5;
            --color-lower: #8cb691;
            --color-upper: #a2beed;
            --color-cardio: #e5a0b0;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-pill: 999px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: -apple-system, BlinkFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: calc(24px + env(safe-area-inset-top)) 12px env(safe-area-inset-bottom) 12px; 
            -webkit-font-smoothing: antialiased; 
        }

        .app-container { max-width: 600px; margin: 0 auto; }
        
        /* 로그인 화면 스타일 */
        .auth-container {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            margin-top: 40px;
        }
        .auth-container h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .auth-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-main);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            background: #fafafa;
        }
        .auth-btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .auth-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn-primary { background: var(--color-upper); color: white; }
        .btn-secondary { background: #e9e9ed; color: var(--text-main); }

        header { text-align: center; margin-bottom: 18px; padding-top: 6px; position: relative; }
        header h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin: 0; }
        .logout-btn {
            position: absolute;
            right: 0;
            top: 6px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tabs { display: flex; background: #e9e9ed; padding: 3px; border-radius: var(--radius-pill); margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 9px; text-align: center; background: none; border: none; border-radius: var(--radius-pill); color: var(--text-sub); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .tab-btn.active { background-color: #ffffff; color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        .sub-tabs { display: flex; background: #ebebef; padding: 3px; border-radius: var(--radius-pill); margin-bottom: 14px; }
        .sub-tab-btn { flex: 1; padding: 7px; text-align: center; background: none; border: none; border-radius: var(--radius-pill); color: var(--text-sub); font-weight: 600; font-size: 0.78rem; cursor: pointer; }
        .sub-tab-btn.active { background-color: #ffffff; color: var(--text-main); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }

        .tab-content { display: none; background: var(--container-bg); padding: 18px; border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .tab-content.active { display: block; }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 8px; }
        .calendar-header button { background: none; border: none; color: #c4c4c8; font-size: 0.85rem; cursor: pointer; padding: 6px 12px; }
        .calendar-header h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: var(--border-main); border: 1px solid var(--border-main); border-radius: 14px; overflow: hidden; }
        .calendar-day-label { text-align: center; padding: 8px 0; font-size: 0.72rem; color: var(--text-sub); font-weight: 600; background-color: var(--bg-color); }
        .calendar-day-label.sunday { color: #e5564e; }
        .calendar-day-label.saturday { color: #5082c5; }

        .calendar-day { position: relative; height: 82px; padding: 4px; background: #ffffff; cursor: pointer; display: flex; flex-direction: column; }
        .calendar-day.other-month .day-number { color: #eeeef2 !important; }
        .calendar-day.has-workout { background-color: #f8f9fa; }

        .day-header-row { position: absolute; top: 4px; left: 4px; display: flex; align-items: center; gap: 2px; z-index: 1; }
        .day-number { font-size: 0.72rem; color: var(--text-main); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }

        .day-center-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; padding-top: 14px; }
        .tag-pill { display: flex; align-items: center; justify-content: center; height: 17px; padding: 0 6px; border-radius: var(--radius-pill); font-size: 0.58rem; color: #ffffff; font-weight: 700; width: 88%; text-align: center; }
        .tag-pt { background-color: var(--color-pt); color: #ffffff; }
        .tag-upper { background-color: var(--color-upper); }
        .tag-lower { background-color: var(--color-lower); }
        .tag-cardio { background-color: var(--color-cardio); }

        .achievement-text-container { text-align: center; margin-top: 20px; font-size: 0.92rem; color: var(--text-main); }
        .blue-highlight-text { color: #5082c5; font-weight: 700; }
        .percent-gray-inline { color: var(--text-sub); font-size: 0.85rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: 1000; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(2px); }
        .modal.active { display: flex; }
        .modal-content { background: #ffffff; padding: 20px; border-radius: 22px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 14px; right: 16px; background: #f2f2f7; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 1.1rem; color: var(--text-sub); cursor: pointer; }
        .modal-header h3 { margin: 0 0 16px 0; font-size: 1.05rem; font-weight: 700; }

        .tag-selector { display: flex; gap: 6px; margin-bottom: 14px; }
        .tag-btn { flex: 1; height: 38px; border-radius: var(--radius-pill); border: none; font-size: 0.82rem; font-weight: 700; cursor: pointer; color: #ffffff; opacity: 0.35; }
        .tag-btn.selected { opacity: 1; transform: scale(1.03); }
        .btn-pt { background-color: var(--color-pt); }
        .btn-upper { background-color: var(--color-upper); }
        .btn-lower { background-color: var(--color-lower); }
        .btn-cardio { background-color: var(--color-cardio); }

        .workout-input-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .workout-input-group input, .workout-input-group select { flex: 1; min-width: 0; padding: 9px; border: 1px solid rgba(200, 200, 210, 0.5); border-radius: 10px; font-size: 0.8rem; background-color: #fafafa; }
        .add-workout-btn { width: 100%; padding: 10px; background-color: var(--color-upper); color: #ffffff; border: none; border-radius: var(--radius-pill); font-weight: 700; font-size: 0.82rem; cursor: pointer; }
        .add-workout-btn.cardio { background-color: var(--color-cardio); }

        .daily-log-container { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-main); }
        .daily-log-list { max-height: 140px; overflow-y: auto; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
        .daily-log-list li { padding: 8px 12px; background-color: #f7f7f9; border-radius: 10px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #efeff3; }
        .del-log { color: #e5564e; background: none; border: none; cursor: pointer; font-size: 0.75rem; }

        .inbody-input-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
        .inbody-input-row input { padding: 9px; border: 1px solid rgba(200, 200, 210, 0.5); border-radius: 10px; font-size: 0.8rem; background: #fafafa; }
        .inbody-input-row button { grid-column: span 2; padding: 10px; background-color: var(--color-upper); color: #ffffff; border: none; border-radius: var(--radius-pill); font-weight: 700; font-size: 0.82rem; cursor: pointer; }
        .chart-container { position: relative; height: 270px; width: 100%; margin-top: 6px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 로그인/회원가입 화면 -->
    <div id="auth-screen" class="auth-container">
        <h2>🏋️ 운동 다이어리 로그인</h2>
        <input type="email" id="auth-email" class="auth-input" placeholder="이메일 주소 입력">
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호 입력">
        <div class="auth-btn-group">
            <button class="auth-btn btn-primary" onclick="handleLogin()">로그인</button>
            <button class="auth-btn btn-secondary" onclick="handleSignUp()">회원가입</button>
        </div>
    </div>

    <!-- 2. 메인 운동 다이어리 화면 (로그인 후 표시) -->
    <div id="main-screen" style="display: none;">
        <header>
            <h1>운동 기록</h1>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('calendar-tab')">🗓️ 운동 달력</button>
            <button class="tab-btn" onclick="openTab('inbody-tab')">📊 인바디 변화</button>
        </div>

        <div id="calendar-tab" class="tab-content active">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">◀</button>
                <h2 id="calendar-title">2026년 8월</h2>
                <button onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <div class="achievement-text-container" id="achievement-text-container">
                이번 달 <span class="blue-highlight-text" id="days-in-month">0일</span> 중 <span class="blue-highlight-text" id="workout-days">0일</span><span class="percent-gray-inline" id="workout-percent">(0%)</span> 운동했어요!
            </div>
        </div>

        <div id="inbody-tab" class="tab-content">
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="openSubTab('muscle-fat-view')">골격근·지방 분석</button>
                <button class="sub-tab-btn" onclick="openSubTab('obesity-view')">비만 분석</button>
            </div>

            <div id="muscle-fat-view" class="sub-tab-content">
                <div class="inbody-input-row">
                    <input type="date" class="inbody-date-input">
                    <input type="number" class="inbody-weight-input" placeholder="체중 (kg)" step="0.1">
                    <input type="number" class="inbody-muscle-input" placeholder="골격근량 (kg)" step="0.1">
                    <input type="number" class="inbody-fat-input" placeholder="체지방량 (kg)" step="0.1">
                    <button onclick="addInBodyRecord('muscle-fat')">골격근·지방 기록 저장</button>
                </div>
            </div>

            <div id="obesity-view" class="sub-tab-content" style="display:none;">
                <div class="inbody-input-row">
                    <input type="date" class="inbody-date-input-obesity">
                    <input type="number" class="inbody-bmi-input" placeholder="BMI" step="0.1">
                    <input type="number" class="inbody-fatpct-input" placeholder="체지방률 (%)" step="0.1">
                    <button onclick="addInBodyRecord('obesity')">비만 분석 기록 저장</button>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="inbodyChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 운동 상세 모달 -->
<div class="modal" id="workout-modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeWorkoutModal()">×</button>
        <div class="modal-header">
            <h3 id="modal-date-title">운동 기록</h3>
        </div>
        
        <div class="tag-selector">
            <button class="tag-btn btn-pt" id="btn-pt" onclick="toggleTag('PT')">PT</button>
            <button class="tag-btn btn-upper" id="btn-upper" onclick="toggleTag('상체')">상체</button>
            <button class="tag-btn btn-lower" id="btn-lower" onclick="toggleTag('하체')">하체</button>
            <button class="tag-btn btn-cardio" id="btn-cardio" onclick="toggleTag('유산소')">유산소</button>
        </div>

        <div id="detailed-inputs">
            <div style="font-size:0.82rem; font-weight:700; margin:14px 0 6px 0;">🏋️ 웨이트 운동 추가</div>
            <div class="workout-input-group">
                <input type="text" id="workout-name" placeholder="운동 이름" style="flex:2;">
            </div>
            <div class="workout-input-group">
                <input type="text" id="workout-weight" placeholder="무게(kg)">
                <input type="text" id="workout-reps" placeholder="횟수">
                <input type="text" id="workout-sets" placeholder="세트">
            </div>
            <button class="add-workout-btn" onclick="addDetailedWorkout()">웨이트 추가</button>
        </div>

        <div id="cardio-inputs">
            <div style="font-size:0.82rem; font-weight:700; margin:14px 0 6px 0;">🏃 유산소 운동 추가</div>
            <div class="workout-input-group">
                <select id="cardio-type">
                    <option value="스텝밀">스텝밀</option>
                    <option value="러닝머신">러닝머신</option>
                    <option value="실내자전거">실내자전거</option>
                </select>
                <select id="cardio-time">
                    <option value="15분">15분</option>
                    <option value="20분">20분</option>
                    <option value="30분">30분</option>
                    <option value="40분">40분</option>
                    <option value="50분">50분</option>
                    <option value="60분 이상">60분 이상</option>
                </select>
            </div>
            <button class="add-workout-btn cardio" onclick="addCardioWorkout()">유산소 추가</button>
        </div>

        <div class="daily-log-container">
            <div style="font-size:0.82rem; font-weight:700; margin-bottom:8px;">📋 오늘 완료한 운동 목록</div>
            <ul class="daily-log-list" id="daily-log-list"></ul>
        </div>
    </div>
</div>

<script>
    // Supabase 프로젝트 클라이언트 연결 정보
    const SUPABASE_URL = 'https://uojffeiyzqtaivwhvjth.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SSeXBWHXPwcvrnWVDYGxeA_EcTEjEcP';
    
    let supabase = null;
    let currentUser = null;
    let currentDate = new Date();
    let selectedDateStr = null;
    let inbodyChart = null;
    let currentInbodyView = 'muscle-fat';
    let workoutData = {};
    let inbodyRecords = [];

    document.addEventListener('DOMContentLoaded', async () => {
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                showMainScreen();
            } else {
                showAuthScreen();
            }
        } else {
            alert('Supabase 라이브러리를 불러오지 못했습니다. 페이지를 새로고침 해보세요.');
        }

        document.querySelectorAll('.inbody-date-input, .inbody-date-input-obesity').forEach(el => el.valueAsDate = new Date());
    });

    // 회원가입 및 로그인 처리
    async function handleSignUp() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        if (!email || !password) return alert('이메일과 비밀번호를 모두 입력해 주세요.');

        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
            alert('회원가입 실패: ' + error.message);
        } else {
            alert('회원가입 성공! [로그인] 버튼을 눌러 들어와 주세요.');
        }
    }

    async function handleLogin() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        if (!email || !password) return alert('이메일과 비밀번호를 모두 입력해 주세요.');

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            alert('로그인 실패: ' + error.message);
        } else {
            currentUser = data.user;
            showMainScreen();
        }
    }

    async function handleLogout() {
        await supabase.auth.signOut();
        currentUser = null;
        showAuthScreen();
    }

    function showAuthScreen() {
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('main-screen').style.display = 'none';
    }

    async function showMainScreen() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'block';
        await fetchUserData();
        renderCalendar();
        initInBodyChart();
    }

    // 서버 클라우드 데이터 로드
    async function fetchUserData() {
        const { data, error } = await supabase.from('workout_logs').select('*').eq('user_id', currentUser.id);
        if (error) return console.error(error);

        workoutData = {};
        inbodyRecords = [];

        data.forEach(row => {
            if (row.workout_data) workoutData[row.date] = row.workout_data;
            if (row.weight || row.skeletal_muscle || row.body_fat_mass || row.bmi || row.body_fat_percent) {
                inbodyRecords.push({
                    id: row.id,
                    date: row.date,
                    weight: row.weight,
                    muscle: row.skeletal_muscle,
                    fat: row.body_fat_mass,
                    bmi: row.bmi,
                    fatPct: row.body_fat_percent
                });
            }
        });
    }

    async function saveWorkoutToDB(dateStr) {
        const data = workoutData[dateStr] || { tags: [], workouts: [], cardios: [] };
        const { data: existing } = await supabase.from('workout_logs').select('id').eq('user_id', currentUser.id).eq('date', dateStr);
        
        if (existing && existing.length > 0) {
            await supabase.from('workout_logs').update({ workout_data: data }).eq('id', existing[0].id);
        } else {
            await supabase.from('workout_logs').insert({ user_id: currentUser.id, date: dateStr, workout_data: data });
        }
    }

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if (tabId === 'inbody-tab') updateChart();
    }

    function openSubTab(subTabId) {
        document.querySelectorAll('.sub-tab-content').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(subTabId).style.display = 'block';
        event.currentTarget.classList.add('active');
        currentInbodyView = (subTabId === 'muscle-fat-view') ? 'muscle-fat' : 'obesity';
        updateChart();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const title = document.getElementById('calendar-title');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth(); 
        title.innerText = `${year}년 ${month + 1}월`;

        const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
        daysOfWeek.forEach((day, index) => {
            const label = document.createElement('div');
            label.className = `calendar-day-label ${index === 0 ? 'sunday' : index === 6 ? 'saturday' : ''}`;
            label.innerText = day;
            grid.appendChild(label);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDaysInMonth = new Date(year, month, 0).getDate();

        for (let i = firstDay - 1; i >= 0; i--) grid.appendChild(createDayCell(year, month - 1, prevDaysInMonth - i, true));
        
        let workoutDaysCount = 0;
        for (let i = 1; i <= daysInMonth; i++) {
            const dayEl = createDayCell(year, month, i, false);
            const dateStr = formatDateStr(year, month + 1, i);
            if (workoutData[dateStr] && (workoutData[dateStr].tags?.length || workoutData[dateStr].workouts?.length || workoutData[dateStr].cardios?.length)) {
                workoutDaysCount++;
            }
            grid.appendChild(dayEl);
        }

        const remainingCells = (7 - (grid.children.length - 7) % 7) % 7;
        for (let i = 1; i <= remainingCells; i++) grid.appendChild(createDayCell(year, month + 1, i, true));

        document.getElementById('days-in-month').innerText = `${daysInMonth}일`;
        document.getElementById('workout-days').innerText = `${workoutDaysCount}일`;
        document.getElementById('workout-percent').innerText = `(${Math.round((workoutDaysCount / daysInMonth) * 100)}%)`;
    }

    function createDayCell(year, monthIndex, dayNum, isOtherMonth) {
        const cellDate = new Date(year, monthIndex, dayNum);
        const dateStr = formatDateStr(cellDate.getFullYear(), cellDate.getMonth() + 1, cellDate.getDate());

        const dayEl = document.createElement('div');
        dayEl.className = `calendar-day ${isOtherMonth ? 'other-month' : ''}`;

        const headerRow = document.createElement('div');
        headerRow.className = 'day-header-row';
        headerRow.innerHTML = `<span class="day-number">${cellDate.getDate()}</span>`;
        dayEl.appendChild(headerRow);

        const centerWrapper = document.createElement('div');
        centerWrapper.className = 'day-center-wrapper';

        if (workoutData[dateStr]?.tags) {
            workoutData[dateStr].tags.forEach(tag => {
                const tagSpan = document.createElement('span');
                tagSpan.className = `tag-pill ${tag === '상체' ? 'tag-upper' : tag === '하체' ? 'tag-lower' : tag === '유산소' ? 'tag-cardio' : 'tag-pt'}`;
                tagSpan.innerText = tag;
                centerWrapper.appendChild(tagSpan);
            });
        }

        dayEl.appendChild(centerWrapper);
        dayEl.onclick = () => openWorkoutModal(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
        return dayEl;
    }

    function formatDateStr(year, month, day) {
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function openWorkoutModal(year, month, day) {
        selectedDateStr = formatDateStr(year, month + 1, day);
        document.getElementById('modal-date-title').innerText = `${month + 1}월 ${day}일 운동 기록`;
        document.getElementById('workout-modal').classList.add('active');
        loadDailyLog();
    }

    function closeWorkoutModal() {
        document.getElementById('workout-modal').classList.remove('active');
        renderCalendar();
    }

    async function toggleTag(tag) {
        if (!workoutData[selectedDateStr]) workoutData[selectedDateStr] = { tags: [], workouts: [], cardios: [] };
        const tags = workoutData[selectedDateStr].tags;
        const idx = tags.indexOf(tag);
        if (idx > -1) tags.splice(idx, 1);
        else tags.push(tag);

        await saveWorkoutToDB(selectedDateStr);
        updateTagButtons();
    }

    function updateTagButtons() {
        document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('selected'));
        if (workoutData[selectedDateStr]?.tags) {
            workoutData[selectedDateStr].tags.forEach(tag => {
                if (tag === 'PT') document.getElementById('btn-pt').classList.add('selected');
                if (tag === '상체') document.getElementById('btn-upper').classList.add('selected');
                if (tag === '하체') document.getElementById('btn-lower').classList.add('selected');
                if (tag === '유산소') document.getElementById('btn-cardio').classList.add('selected');
            });
        }
    }

    async function addDetailedWorkout() {
        const name = document.getElementById('workout-name').value.trim();
        if (!name) return alert('운동 이름을 입력하세요.');
        if (!workoutData[selectedDateStr]) workoutData[selectedDateStr] = { tags: [], workouts: [], cardios: [] };

        workoutData[selectedDateStr].workouts.push({
            name,
            weight: document.getElementById('workout-weight').value,
            reps: document.getElementById('workout-reps').value,
            sets: document.getElementById('workout-sets').value
        });

        await saveWorkoutToDB(selectedDateStr);
        loadDailyLog();
        document.getElementById('workout-name').value = '';
    }

    async function addCardioWorkout() {
        if (!workoutData[selectedDateStr]) workoutData[selectedDateStr] = { tags: [], workouts: [], cardios: [] };
        if (!workoutData[selectedDateStr].tags.includes('유산소')) workoutData[selectedDateStr].tags.push('유산소');

        workoutData[selectedDateStr].cardios.push({
            type: document.getElementById('cardio-type').value,
            time: document.getElementById('cardio-time').value
        });

        await saveWorkoutToDB(selectedDateStr);
        loadDailyLog();
    }

    function loadDailyLog() {
        const list = document.getElementById('daily-log-list');
        list.innerHTML = '';
        updateTagButtons();

        const data = workoutData[selectedDateStr];
        if (data) {
            data.workouts?.forEach((w, i) => {
                list.innerHTML += `<li><span><strong>${w.name}</strong> · ${w.weight}kg ${w.reps}회 ${w.sets}세트</span><button class="del-log" onclick="deleteLog('workout', ${i})">삭제</button></li>`;
            });
            data.cardios?.forEach((c, i) => {
                list.innerHTML += `<li><span><strong>${c.type}</strong> · ${c.time}</span><button class="del-log" onclick="deleteLog('cardio', ${i})">삭제</button></li>`;
            });
        }
    }

    async function deleteLog(type, index) {
        if (type === 'workout') workoutData[selectedDateStr].workouts.splice(index, 1);
        else workoutData[selectedDateStr].cardios.splice(index, 1);
        await saveWorkoutToDB(selectedDateStr);
        loadDailyLog();
    }

    // 인바디 차트 함수
    function initInBodyChart() {
        const ctx = document.getElementById('inbodyChart').getContext('2d');
        inbodyChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: { responsive: true, maintainAspectRatio: false }
        });
        updateChart();
    }

    async function addInBodyRecord(type) {
        if (type === 'muscle-fat') {
            const date = document.querySelector('.inbody-date-input').value;
            const weight = parseFloat(document.querySelector('.inbody-weight-input').value) || null;
            const muscle = parseFloat(document.querySelector('.inbody-muscle-input').value) || null;
            const fat = parseFloat(document.querySelector('.inbody-fat-input').value) || null;

            await supabase.from('workout_logs').insert({
                user_id: currentUser.id,
                date, weight, skeletal_muscle: muscle, body_fat_mass: fat
            });
        } else {
            const date = document.querySelector('.inbody-date-input-obesity').value;
            const bmi = parseFloat(document.querySelector('.inbody-bmi-input').value) || null;
            const fatPct = parseFloat(document.querySelector('.inbody-fatpct-input').value) || null;

            await supabase.from('workout_logs').insert({
                user_id: currentUser.id,
                date, bmi, body_fat_percent: fatPct
            });
        }

        await fetchUserData();
        updateChart();
    }

    function updateChart() {
        if (!inbodyChart) return;
        inbodyRecords.sort((a,b) => new Date(a.date) - new Date(b.date));
        inbodyChart.data.labels = inbodyRecords.map(r => r.date);

        if (currentInbodyView === 'muscle-fat') {
            inbodyChart.data.datasets = [
                { label: '체중 (kg)', data: inbodyRecords.map(r => r.weight), borderColor: '#e06d53', spanGaps: true },
                { label: '골격근량 (kg)', data: inbodyRecords.map(r => r.muscle), borderColor: '#8cb691', spanGaps: true },
                { label: '체지방량 (kg)', data: inbodyRecords.map(r => r.fat), borderColor: '#8eabf4', spanGaps: true }
            ];
        } else {
            inbodyChart.data.datasets = [
                { label: 'BMI', data: inbodyRecords.map(r => r.bmi), borderColor: '#8eabf4', spanGaps: true },
                { label: '체지방률 (%)', data: inbodyRecords.map(r => r.fatPct), borderColor: '#e06d53', spanGaps: true }
            ];
        }
        inbodyChart.update();
    }
</script>
