<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1. 앱 공유/브라우저 탭 이름 'H'로 설정 -->
  <title>H</title>
  <style>
    :root {
      /* 6, 9, 10. 감성적이고 톤다운된 파스텔/회색조 컬러 팔레트 */
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #777777;
      --arrow-color: #a0a0a0; /* 9. 연한 회색 화살표 */
      --border-color: #e9ecef;
      
      /* 6. 덜 쨍하고 은은한 운동 타입별 파스텔 톤 */
      --color-upper: #e2ece9;
      --color-lower: #dfe7fd;
      --color-cardio: #fde2e4;
      --color-pt: #e8e8e8; /* 8. PT 버튼 배경색 */
      --color-saturday: #6c8ebd; /* 10. 덜 쨍한 토요일 파란색 */
      --color-dark-gray: #555555; /* 19. 버튼용 진한 회색 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* 17. 상단 헤더 제목 중앙 정렬 */
    header {
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 70px;
    }

    /* 하단 탭 바 */
    nav.tab-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: var(--card-bg);
      display: flex;
      border-top: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
      background: none;
      font-size: 14px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--text-main);
      font-weight: bold;
    }

    /* 달력 스타일 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-header button {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--arrow-color); /* 9. 연한 회색 화살표 */
      cursor: pointer;
      padding: 0 10px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
    }

    .day-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      padding-bottom: 8px;
    }
    
    .day-name:nth-child(7) { color: var(--color-saturday); } /* 10. 토요일 파란색 */
    .day-name:nth-child(1) { color: #e57373; }

    .day-cell {
      min-height: 52px;
      border-radius: 8px;
      padding: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .day-cell:nth-child(7n) .day-num { color: var(--color-saturday); } /* 10. 토요일 파란색 */
    .day-cell:nth-child(7n-6) .day-num { color: #e57373; }

    .tag-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      margin-top: 2px;
    }

    .tag {
      font-size: 9px;
      padding: 2px 0;
      border-radius: 4px;
      text-align: center;
      color: #444;
    }

    /* 6, 8. 톤다운된 타입별 버튼/태그 색상 */
    .tag.upper { background: var(--color-upper); }
    .tag.lower { background: var(--color-lower); }
    .tag.cardio { background: var(--color-cardio); }
    .tag.pt { background: var(--color-pt); color: #000; } /* 8. PT 글자 검정색 */

    /* 2. 하단 버튼 영역 (이모지 없음, 띄어쓰기 적용) */
    .calendar-actions {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }

    /* 7. 고정된 크기의 균일한 운동 선택 버튼 Grid */
    .type-btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .type-btn {
      width: 100%;
      height: 40px; /* 7. 모든 버튼 크기 동일 고정 */
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .type-btn.upper { background: var(--color-upper); color: #333; }
    .type-btn.lower { background: var(--color-lower); color: #333; }
    .type-btn.cardio { background: var(--color-cardio); color: #333; }
    .type-btn.pt { background: var(--color-pt); color: #000; } /* 8. PT 글자 검정 */

    /* 19. 다크 그레이 추가 버튼 */
    .btn-dark {
      background: var(--color-dark-gray);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 모달 레이아웃 */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-height: 85%;
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
    }

    /* 입력 폼 및 모듈 공통 */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    /* 14. 비밀번호 + 눈 모양 버튼 스타일 */
    .pw-input-wrapper {
      position: relative;
      width: 100%;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-sub);
    }

    /* 11. 마이페이지 심플 사람 실루엣 아이콘 */
    .user-silhouette-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      display: block;
    }

    /* 20. 목표 체중 감량 프로그레스 바 (채움 대신 잔여량 직관 표시) */
    .weight-progress-container {
      background: #f1f3f5;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
    }

    .progress-bar-bg {
      background: #e9ecef;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: #94a3b8;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    /* 21. 인바디 항목 간격 조정 */
    .inbody-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .inbody-item span {
      margin-right: 12px; /* 21. 텍스트 간 붙지 않게 여백 지정 */
    }

    /* 22. 범례 얇은 테두리 */
    .chart-legend-box {
      width: 12px;
      height: 12px;
      display: inline-block;
      border: 1px solid #ccc; /* 22. 얇은 테두리 적용 */
      margin-right: 4px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 1, 17. 상단 헤더 (한글 '운동 기록', 중앙 정련) -->
  <header>운동 기록</header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="main-content">
    
    <!-- A. 운동 달력 탭 -->
    <section id="tab-calendar">
      <div class="calendar-header">
        <button id="prev-month">&lt;</button>
        <span id="calendar-title" style="font-weight: 600;">2026.08</span>
        <button id="next-month">&gt;</button>
      </div>

      <div class="calendar-grid" id="calendar-board">
        <div class="day-name">일</div><div class="day-name">월</div><div class="day-name">화</div>
        <div class="day-name">수</div><div class="day-name">목</div><div class="day-name">금</div>
        <div class="day-name">토</div>
        <!-- 날짜 셀 스크립트 생성 -->
      </div>

      <!-- 2. 하단 버튼 영역 (띄어쓰기 적용, 이모지 없음) -->
      <div class="calendar-actions">
        <button class="action-btn" onclick="openExerciseList()">운동 목록</button>
        <button class="action-btn" onclick="openJournalList()">운동 일기 전체 보기</button>
      </div>
    </section>

    <!-- B. 인바디 기록 탭 (18) -->
    <section id="tab-inbody" class="hidden">
      <!-- 20. 목표 체중 감량 문구 및 역방향 진행바 -->
      <div class="weight-progress-container">
        <!-- 20. 'nkg 남았어요.' 표현 적용 -->
        <div id="weight-remaining-text" style="font-size: 14px; font-weight: 600;">목표 체중까지 5.0kg 남았어요.</div>
        <div style="font-size: 11px; color: var(--text-sub); margin-top: 2px;">목표 달성을 향해 남은 비중</div>
        <div class="progress-bar-bg">
          <div id="weight-progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 8px;">
          <!-- 22. 범례 박스 얇은 테두리 적용 -->
          <span style="margin-right: 8px;"><i class="chart-legend-box" style="background: #a8dadc;"></i>체중</span>
          <span style="margin-right: 8px;"><i class="chart-legend-box" style="background: #f4a261;"></i>골격근량</span>
          <span><i class="chart-legend-box" style="background: #e76f51;"></i>체지방량</span>
        </div>
        
        <!-- 21. 붙어있는 항목 수정 및 인바디 리스트 -->
        <div id="inbody-list">
          <div class="inbody-item">
            <span>2026.08.01</span>
            <span>체중: 68kg</span>
            <span>BMI: 22.5</span>
          </div>
          <div class="inbody-item">
            <span>2026.08.01</span>
            <span>골격근: 30kg</span>
            <span>체지방: 15kg</span>
          </div>
        </div>
      </div>
    </section>

    <!-- C. 마이페이지 탭 -->
    <section id="tab-mypage" class="hidden">
      <!-- 11. 심플 사람 모양 실루엣 SVG (배경 없음) -->
      <svg class="user-silhouette-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>

      <!-- 3, 4. 호칭 처리 (이름 '윤효은' 입력 시 '효은님,' 출력 / 큰따옴표 제거) -->
      <div id="greeting-text" style="text-align: center; font-size: 16px; font-weight: 600; margin-bottom: 20px;">
        효은님, 오늘도 건강한 하루 보내세요!
      </div>

      <!-- 16. 키, 목표 몸무게 단위 및 항목 명확화 -->
      <div style="background: var(--card-bg); padding: 16px; border-radius: 12px;">
        <div class="form-group">
          <label>키 (cm)</label>
          <input type="number" value="165" placeholder="cm 단위 입력">
        </div>
        <div class="form-group">
          <label>현재 몸무게 (kg)</label>
          <input type="number" value="65" placeholder="kg 단위 입력">
        </div>
        <div class="form-group">
          <label>목표 몸무게 (kg)</label>
          <input type="number" value="60" placeholder="kg 단위 입력">
        </div>
        <button class="action-btn" style="background: #333; color: #fff;">정보 수정 저장</button>
      </div>
    </section>

  </main>

  <!-- 18. 변경된 하단 탭 이름 ('운동 달력', '인바디 기록') -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('calendar')">운동 달력</button>
    <button class="tab-btn" onclick="switchTab('inbody')">인바디 기록</button>
    <button class="tab-btn" onclick="switchTab('mypage')">마이페이지</button>
  </nav>

  <!-- 5, 7, 8, 19. 날짜 클릭 운동 기록 모달 -->
  <div class="modal" id="exercise-modal">
    <div class="modal-content">
      <h3 id="modal-date-title" style="margin-bottom: 12px; text-align: center;">8월 17일 운동</h3>
      
      <!-- 7. 버튼 크기/타입 균일화 Grid -->
      <div class="type-btn-grid">
        <button class="type-btn upper">상체</button>
        <button class="type-btn lower">하체</button>
        <button class="type-btn cardio">유산소</button>
        <button class="type-btn pt">PT</button> <!-- 8. 글자색 검정 -->
      </div>

      <!-- 19. '추가' 문구 삭제 및 진한 회색 버튼 -->
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <button class="btn-dark" style="flex:1;">웨이트 운동</button>
        <button class="btn-dark" style="flex:1;">유산소 운동</button>
      </div>

      <div class="form-group">
        <label>운동 일기</label>
        <textarea style="width: 100%; height: 60px; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px;"></textarea>
      </div>

      <!-- 5. X 닫기(취소)와 저장 버튼 분리 -->
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="action-btn" style="flex: 1;" onclick="closeModal()">취소 (X)</button>
        <button class="action-btn" style="flex: 1; background: #333; color: #fff;" onclick="saveModalData()">저장</button>
      </div>
    </div>
  </div>

  <!-- 회원가입 모달 (12, 13, 14, 15, 23 반영) -->
  <div class="modal" id="signup-modal">
    <div class="modal-content">
      <h3 style="text-align: center; margin-bottom: 16px;">회원가입</h3>
      
      <!-- 23. 이름 예시 '김헬짱' -->
      <div class="form-group">
        <label>이름</label>
        <input type="text" placeholder="예: 김헬짱">
      </div>

      <!-- 12. 만 나이가 아닌 생년월일 입력 -->
      <div class="form-group">
        <label>생년월일 (만 나이 자동 계산)</label>
        <input type="date">
      </div>

      <!-- 13. 이메일 아이디 + @ + 도메인 선택/직접입력 -->
      <div class="form-group">
        <label>이메일 계정</label>
        <div class="input-row">
          <input type="text" placeholder="아이디">
          <span>@</span>
          <select onchange="handleDomainChange(this)">
            <option value="naver.com">naver.com</option>
            <option value="gmail.com">gmail.com</option>
            <option value="daum.net">daum.net</option>
            <option value="hanmail.net">hanmail.net</option>
            <option value="custom">직접 입력</option>
          </select>
        </div>
        <input type="text" id="custom-domain-input" class="hidden" placeholder="도메인 직접 입력" style="margin-top: 6px;">
      </div>

      <!-- 14, 15. 비밀번호 토글 및 비밀번호 재확인 -->
      <div class="form-group">
        <label>비밀번호</label>
        <div class="pw-input-wrapper">
          <input type="password" id="signup-pw">
          <button class="pw-toggle-btn" onclick="togglePwVisibility('signup-pw')">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label>비밀번호 확인</label>
        <div class="pw-input-wrapper">
          <input type="password" id="signup-pw-confirm">
          <button class="pw-toggle-btn" onclick="togglePwVisibility('signup-pw-confirm')">👁️</button>
        </div>
      </div>

      <button class="action-btn" style="background: #333; color: #fff;" onclick="closeSignup()">가입하기</button>
    </div>
  </div>

</div>

<script>
  // 4. 이름 자동 호칭 변환 로직 (예: '윤효은' -> '효은님,')
  function formatNameGreeting(fullName) {
    let displayName = fullName;
    if (fullName.length >= 3) {
      displayName = fullName.substring(1); // 성 제외
    }
    return `${displayName}님,`;
  }

  // 12. 생년월일 기준 만 나이 계산 로직
  function calculateAge(birthDateString) {
    const today = new Date();
    const birthDate = new Date(birthDateString);
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
      age--;
    }
    return age;
  }

  // 14. 비밀번호 보이기/숨기기 토글
  function togglePwVisibility(inputId) {
    const input = document.getElementById(inputId);
    input.type = input.type === "password" ? "text" : "password";
  }

  // 13. 도메인 선택 변경 처리
  function handleDomainChange(selectEl) {
    const customInput = document.getElementById('custom-domain-input');
    if (selectEl.value === 'custom') {
      customInput.classList.remove('hidden');
    } else {
      customInput.classList.add('hidden');
    }
  }

  // 탭 전환 함수
  function switchTab(tabName) {
    document.querySelectorAll('.main-content > section').forEach(sec => sec.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    event.target.classList.add('active');
  }

  // 달력 모달 처리 (5. 저장 버튼 눌렀을 때만 반영)
  let selectedCell = null;
  function openDateModal(cell) {
    selectedCell = cell;
    document.getElementById('exercise-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('exercise-modal').style.display = 'none';
    selectedCell = null; // 저장 없이 취소
  }

  function saveModalData() {
    // 5. 저장 클릭 시만 달력 UI 업로드 반영
    if (selectedCell) {
      let tagList = selectedCell.querySelector('.tag-list');
      if(!tagList) {
        tagList = document.createElement('div');
        tagList.className = 'tag-list';
        selectedCell.appendChild(tagList);
      }
      tagList.innerHTML = `<div class="tag upper">상체</div>`;
    }
    closeModal();
  }

  function closeSignup() {
    document.getElementById('signup-modal').style.display = 'none';
  }

  // 달력 날짜 렌더링 (간단 예시)
  function initCalendar() {
    const board = document.getElementById('calendar-board');
    for (let i = 1; i <= 31; i++) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';
      dayCell.innerHTML = `<span class="day-num">${i}</span>`;
      dayCell.onclick = () => openDateModal(dayCell);
      board.appendChild(dayCell);
    }
  }

  window.onload = function() {
    initCalendar();
  };
</script>
</body>
</html>
