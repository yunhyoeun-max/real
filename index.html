<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 뷰포트 설정: 사용자 확대 방지 및 Safe Area 대응 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Safari 전용 앱 모드(전체 화면) 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="운동 기록">

    <!-- Android Chrome 전용 앱 모드 설정 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f6f6f8">

    <title>운동 기록 및 인바디 다이어리</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f6f6f8; 
            --container-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            
            /* 달력 기본 테두리 */
            --border-main: #ebebef; 

            /* 파스텔 팔레트 */
            --color-pt: #a0a0a5;      /* PT: 연한 회색 톤으로 수정 */
            --color-lower: #8cb691;   /* 하체: 세이지 그린 */
            --color-upper: #a2beed;   /* 상체: 덜 쨍하고 차분해진 소프트 스카이 블루 */
            --color-cardio: #e5a0b0;  /* 유산소: 인디 핑크 */
            
            /* 인바디 다홍색 포인트 */
            --color-dahong: #e06d53;  

            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-pill: 999px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: -apple-system, BlinkFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            /* 상단 노치/카메라 가림을 방지하기 위해 기본 여백 + Safe Area 적용 */
            padding: calc(24px + env(safe-area-inset-top)) 12px env(safe-area-inset-bottom) 12px; 
            -webkit-font-smoothing: antialiased; 
        }

        .app-container { max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 18px; padding-top: 6px; }
        header h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin: 0; letter-spacing: -0.5px; }

        /* 메인 탭 UI */
        .tabs { 
            display: flex; 
            background: #e9e9ed; 
            padding: 3px; 
            border-radius: var(--radius-pill); 
            margin-bottom: 16px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 9px; 
            text-align: center; 
            background: none; 
            border: none; 
            border-radius: var(--radius-pill); 
            color: var(--text-sub); 
            font-weight: 600; 
            font-size: 0.85rem;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .tab-btn.active { 
            background-color: #ffffff; 
            color: var(--text-main); 
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
        }

        /* 서브 탭 (인바디 전용) */
        .sub-tabs {
            display: flex;
            background: #ebebef;
            padding: 3px;
            border-radius: var(--radius-pill);
            margin-bottom: 14px;
        }
        .sub-tab-btn {
            flex: 1;
            padding: 7px;
            text-align: center;
            background: none;
            border: none;
            border-radius: var(--radius-pill);
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .sub-tab-btn.active {
            background-color: #ffffff;
            color: var(--text-main);
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .tab-content { display: none; background: var(--container-bg); padding: 18px; border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .tab-content.active { display: block; }

        /* 달력 헤더 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 8px; }
        .calendar-header button { 
            background: none; 
            border: none; 
            color: #c4c4c8; 
            font-size: 0.85rem; 
            cursor: pointer; 
            padding: 6px 12px;
            transition: color 0.2s;
        }
        .calendar-header button:active { color: #8e8e93; }
        .calendar-header h2 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }

        /* 달력 그리드 */
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 1px;
            background-color: var(--border-main);
            border: 1px solid var(--border-main);
            border-radius: 14px;
            overflow: hidden;
        }
        
        .calendar-day-label { 
            text-align: center; 
            padding: 8px 0; 
            font-size: 0.72rem; 
            color: var(--text-sub); 
            font-weight: 600; 
            background-color: var(--bg-color); 
        }
        .calendar-day-label.sunday { color: #e5564e; }
        .calendar-day-label.saturday { color: #5082c5; }

        .calendar-day { 
            position: relative; 
            height: 82px; 
            padding: 4px; 
            background: #ffffff; 
            cursor: pointer; 
            display: flex;
            flex-direction: column;
        }

        .calendar-day.other-month { 
            background-color: #ffffff; /* 다른 달 날짜 칸도 흰색으로 고정 */
        }
        
        /* 이전/다음달 날짜 색상을 훨씬 더 연하게 변경 */
        .calendar-day.other-month .day-number { color: #eeeef2 !important; }
        .calendar-day.other-month.is-sunday .day-number,
        .calendar-day.other-month.is-holiday .day-number { color: #e5564e !important; opacity: 0.15; }
        .calendar-day.other-month.is-saturday .day-number { color: #5082c5 !important; opacity: 0.15; }

        /* 다른 달 날짜의 운동 태그는 연하게(투명하게) 처리 */
        .calendar-day.other-month .tag-pill {
            opacity: 0.42;
        }

        .calendar-day.has-workout {
            background-color: #f8f9fa;
        }

        .day-header-row {
            position: absolute;
            top: 4px;
            left: 4px;
            display: flex;
            align-items: center;
            gap: 2px;
            z-index: 1;
        }

        .day-number { 
            font-size: 0.72rem; 
            color: var(--text-main); 
            font-weight: 500; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .calendar-day.is-sunday .day-number,
        .calendar-day.is-holiday .day-number { color: #e5564e; }
        .calendar-day.is-saturday:not(.is-holiday) .day-number { color: #5082c5; }

        .day-center-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            padding-top: 14px;
        }

        /* 알약(Pill) 태그 */
        .tag-pill { 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 17px; 
            padding: 0 6px; 
            border-radius: var(--radius-pill); 
            font-size: 0.58rem; 
            color: #ffffff; 
            font-weight: 700; 
            width: 88%; 
            text-align: center;
            line-height: 1;
            transition: opacity 0.2s;
        }
        .tag-pt { background-color: var(--color-pt); color: #ffffff; }
        .tag-upper { background-color: var(--color-upper); }
        .tag-lower { background-color: var(--color-lower); }
        .tag-cardio { background-color: var(--color-cardio); }

        /* 하단 달성 문구 */
        .achievement-text-container {
            text-align: center;
            margin-top: 20px;
            font-size: 0.92rem;
            font-weight: 400; 
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .blue-highlight-text { color: #5082c5; font-weight: 700; }
        .percent-gray-inline { color: var(--text-sub); font-weight: 400; font-size: 0.85rem; margin-right: 2px; }

        /* 모달 팝업 UI */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.35); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            padding: 16px; 
            backdrop-filter: blur(2px);
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 22px; 
            width: 100%; 
            max-width: 400px; 
            max-height: 85vh;
            overflow-y: auto;
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .close-modal { 
            position: absolute; 
            top: 14px; right: 16px; 
            background: #f2f2f7; 
            border: none; 
            width: 28px; height: 28px;
            border-radius: 50%;
            font-size: 1.1rem; 
            color: var(--text-sub); 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-header h3 { margin: 0 0 16px 0; font-size: 1.05rem; font-weight: 700; }
        
        .tag-selector { display: flex; gap: 6px; margin-bottom: 14px; }
        .tag-btn { 
            flex: 1; 
            height: 38px;
            border-radius: var(--radius-pill); 
            border: none; 
            font-size: 0.82rem; 
            font-weight: 700; 
            cursor: pointer; 
            color: #ffffff; 
            opacity: 0.35;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .tag-btn.selected { opacity: 1; transform: scale(1.03); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
        .btn-pt { background-color: var(--color-pt); color: #ffffff; }
        .btn-upper { background-color: var(--color-upper); }
        .btn-lower { background-color: var(--color-lower); }
        .btn-cardio { background-color: var(--color-cardio); }
        
        .section-title { font-size: 0.82rem; font-weight: 700; margin: 14px 0 6px 0; }

        .workout-input-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .workout-input-group input, .workout-input-group select { 
            flex: 1; 
            min-width: 0;
            padding: 9px; 
            border: 1px solid rgba(200, 200, 210, 0.5); 
            border-radius: 10px; 
            font-size: 0.8rem; 
            background-color: #fafafa;
            -webkit-appearance: none;
        }
        
        .add-workout-btn { 
            width: 100%; 
            padding: 10px; 
            background-color: var(--color-upper); 
            color: #ffffff; 
            border: none; 
            border-radius: var(--radius-pill); 
            font-weight: 700; 
            font-size: 0.82rem;
            cursor: pointer; 
        }
        .add-workout-btn.cardio { background-color: var(--color-cardio); }

        .daily-log-container {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-main);
        }
        .daily-log-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .daily-log-list { 
            max-height: 140px; 
            overflow-y: auto; 
            list-style: none; 
            padding: 0; 
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .daily-log-list li { 
            padding: 8px 12px; 
            background-color: #f7f7f9;
            border-radius: 10px;
            font-size: 0.8rem; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            border: 1px solid #efeff3;
        }
        .daily-log-list li .log-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .daily-log-list li .log-badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e5e5ea;
            color: #555;
            font-weight: 600;
        }
        .del-log { color: #e5564e; background: none; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 600; }

        /* 인바디 탭 레이아웃 */
        .inbody-input-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
        .inbody-input-row input { padding: 9px; border: 1px solid rgba(200, 200, 210, 0.5); border-radius: 10px; font-size: 0.8rem; background: #fafafa; -webkit-appearance: none; }
        .inbody-input-row button { 
            grid-column: span 2;
            padding: 10px; 
            background-color: var(--color-upper);
            color: #ffffff; 
            border: none; 
            border-radius: var(--radius-pill); 
            font-weight: 700; 
            font-size: 0.82rem;
            cursor: pointer; 
        }
        .chart-container { position: relative; height: 270px; width: 100%; margin-top: 6px; }

        @media (max-width: 480px) {
            body { padding-left: 6px; padding-right: 6px; }
            .calendar-day { height: 78px; padding: 3px; }
            .tag-pill { font-size: 0.55rem; height: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>운동 기록</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('calendar-tab')">🗓️ 운동 달력</button>
        <button class="tab-btn" onclick="openTab('inbody-tab')">📊 인바디 변화</button>
    </div>

    <!-- 1. 달력 탭 -->
    <div id="calendar-tab" class="tab-content active">
        <div class="calendar-header">
            <button id="prev-month-btn" onclick="changeMonth(-1)">◀</button>
            <h2 id="calendar-title">2026년 8월</h2>
            <button id="next-month-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        
        <div class="achievement-text-container" id="achievement-text-container">
            효은님, 이번 달 <span class="blue-highlight-text" id="days-in-month">31일</span> 중 <span class="blue-highlight-text" id="workout-days">5일</span><span class="percent-gray-inline" id="workout-percent">(16%)</span> 운동했어요!
        </div>
    </div>

    <!-- 2. 인바디 탭 -->
    <div id="inbody-tab" class="tab-content">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" onclick="openSubTab('muscle-fat-view')">골격근·지방 분석</button>
            <button class="sub-tab-btn" onclick="openSubTab('obesity-view')">비만 분석</button>
        </div>

        <div id="muscle-fat-view" class="sub-tab-content">
            <div class="inbody-input-row">
                <input type="date" class="inbody-date-input">
                <input type="number" class="inbody-weight-input" placeholder="체중 (kg)" step="0.1">
                <input type="number" class="inbody-muscle-input" placeholder="골격근량 (kg)" step="0.1">
                <input type="number" class="inbody-fat-input" placeholder="체지방량 (kg)" step="0.1">
                <button onclick="addInBodyRecord('muscle-fat')">골격근·지방 기록 저장</button>
            </div>
        </div>

        <div id="obesity-view" class="sub-tab-content" style="display:none;">
            <div class="inbody-input-row">
                <input type="date" class="inbody-date-input-obesity">
                <input type="number" class="inbody-bmi-input" placeholder="BMI" step="0.1">
                <input type="number" class="inbody-fatpct-input" placeholder="체지방률 (%)" step="0.1">
                <button onclick="addInBodyRecord('obesity')">비만 분석 기록 저장</button>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="inbodyChart"></canvas>
        </div>
    </div>
</div>

<!-- 운동 상세 모달 -->
<div class="modal" id="workout-modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeWorkoutModal()">×</button>
        <div class="modal-header">
            <h3 id="modal-date-title">8월 14일 운동 기록</h3>
        </div>
        
        <div class="tag-selector">
            <button class="tag-btn btn-pt" id="btn-pt" onclick="toggleTag('PT')">PT</button>
            <button class="tag-btn btn-upper" id="btn-upper" onclick="toggleTag('상체')">상체</button>
            <button class="tag-btn btn-lower" id="btn-lower" onclick="toggleTag('하체')">하체</button>
            <button class="tag-btn btn-cardio" id="btn-cardio" onclick="toggleTag('유산소')">유산소</button>
        </div>

        <div id="detailed-inputs">
            <div class="section-title">🏋️ 웨이트 운동 추가</div>
            <div class="workout-input-group">
                <input type="text" id="workout-name" placeholder="운동 이름" style="flex:2;">
            </div>
            <div class="workout-input-group">
                <input type="text" id="workout-weight" placeholder="무게(kg)">
                <input type="text" id="workout-reps" placeholder="횟수">
                <input type="text" id="workout-sets" placeholder="세트">
            </div>
            <button class="add-workout-btn" onclick="addDetailedWorkout()">웨이트 추가</button>
        </div>

        <div id="cardio-inputs">
            <div class="section-title">🏃 유산소 운동 추가</div>
            <div class="workout-input-group">
                <select id="cardio-type">
                    <option value="스텝밀">스텝밀</option>
                    <option value="러닝머신">러닝머신</option>
                    <option value="실내자전거">실내자전거</option>
                </select>
                <select id="cardio-time">
                    <option value="15분">15분</option>
                    <option value="20분">20분</option>
                    <option value="30분">30분</option>
                    <option value="40분">40분</option>
                    <option value="50분">50분</option>
                    <option value="60분 이상">60분 이상</option>
                </select>
            </div>
            <button class="add-workout-btn cardio" onclick="addCardioWorkout()">유산소 추가</button>
        </div>

        <div class="daily-log-container">
            <div class="daily-log-title">📋 오늘 완료한 운동 목록</div>
            <ul class="daily-log-list" id="daily-log-list"></ul>
        </div>
    </div>
</div>

<!-- 인바디 수정 모달 -->
<div class="modal" id="inbody-edit-modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeInbodyEditModal()">×</button>
        <div class="modal-header">
            <h3 id="inbody-modal-date-title">인바디 기록 관리</h3>
        </div>
        <div id="inbody-edit-fields" class="workout-input-group" style="flex-direction:column; gap:8px;"></div>
        <div style="display:flex; gap:8px; margin-top:14px;">
            <button class="add-workout-btn" onclick="saveInbodyEdit()" style="flex:1;">수정 완료</button>
            <button class="add-workout-btn" onclick="deleteInbodyEdit()" style="flex:1; background-color:#e5564e;">삭제</button>
        </div>
    </div>
</div>

<script>
    let currentDate = new Date();
    let selectedDateStr = null;
    let inbodyChart = null;
    let currentInbodyView = 'muscle-fat';
    let selectedInbodyIdx = null;

    /* 💡 음력 명절 맵 (2024년 ~ 2030년 자동 대응) */
    const lunarHolidaysData = {
        2024: { seollal: ["2024-02-09", "2024-02-10", "2024-02-11"], buddha: "2024-05-15", chuseok: ["2024-09-16", "2024-09-17", "2024-09-18"] },
        2025: { seollal: ["2025-01-28", "2025-01-29", "2025-01-30"], buddha: "2025-05-05", chuseok: ["2025-10-05", "2025-10-06", "2025-10-07"] },
        2026: { seollal: ["2026-02-16", "2026-02-17", "2026-02-18"], buddha: "2026-05-24", chuseok: ["2026-09-24", "2026-09-25", "2026-09-26"] },
        2027: { seollal: ["2027-02-06", "2027-02-07", "2027-02-08"], buddha: "2027-05-13", chuseok: ["2027-09-14", "2027-09-15", "2027-09-16"] },
        2028: { seollal: ["2028-01-26", "2028-01-27", "2028-01-28"], buddha: "2028-05-02", chuseok: ["2028-10-02", "2028-10-03", "2028-10-04"] },
        2029: { seollal: ["2029-02-12", "2029-02-13", "2029-02-14"], buddha: "2029-05-20", chuseok: ["2029-09-21", "2029-09-22", "2029-09-23"] },
        2030: { seollal: ["2030-02-02", "2030-02-03", "2030-02-04"], buddha: "2030-05-09", chuseok: ["2030-09-11", "2030-09-12", "2030-09-13"] }
    };

    /* 💡 매년 자동 계산되는 대한민국 공휴일 알고리즘 (대체공휴일 포함) */
    function getHolidaysSetForYear(year) {
        const set = new Set();
        
        // 1. 양력 고정 공휴일
        const fixedSolar = ["01-01", "03-01", "05-05", "06-06", "08-15", "10-03", "10-09", "12-25"];
        fixedSolar.forEach(md => set.add(`${year}-${md}`));

        // 2. 음력 명절 추가
        const lunarData = lunarHolidaysData[year];
        if (lunarData) {
            lunarData.seollal.forEach(d => set.add(d));
            set.add(lunarData.buddha);
            lunarData.chuseok.forEach(d => set.add(d));
        }

        // 3. 대체공휴일 자동 계산
        const altTargets = [
            `${year}-03-01`, `${year}-05-05`, `${year}-08-15`, `${year}-10-03`, `${year}-10-09`
        ];
        if (lunarData) {
            altTargets.push(lunarData.buddha);
            lunarData.seollal.forEach(d => altTargets.push(d));
            lunarData.chuseok.forEach(d => altTargets.push(d));
        }

        altTargets.forEach(dateStr => {
            const dt = new Date(dateStr);
            const dayOfWeek = dt.getDay(); // 0: 일, 6: 토
            
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                let altDate = new Date(dt);
                while (true) {
                    altDate.setDate(altDate.getDate() + 1);
                    const altStr = formatDateObj(altDate);
                    const altDay = altDate.getDay();
                    
                    if (altDay !== 0 && altDay !== 6 && !set.has(altStr)) {
                        set.add(altStr);
                        break;
                    }
                }
            }
        });

        return set;
    }

    function formatDateObj(dt) {
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const d = String(dt.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const title = document.getElementById('calendar-title');
        grid.innerHTML = '';

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth(); 
        title.innerText = `${year}년 ${month + 1}월`;

        const holidaySet = getHolidaysSetForYear(year);

        const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
        daysOfWeek.forEach((day, index) => {
            const label = document.createElement('div');
            let className = 'calendar-day-label';
            if (index === 0) className += ' sunday';
            if (index === 6) className += ' saturday';
            label.className = className;
            label.innerText = day;
            grid.appendChild(label);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDaysInMonth = new Date(year, month, 0).getDate();

        // 1. 지난 달 (이전 달 날짜라도 운동 기록 태그 표시 & 투명도 적용)
        for (let i = firstDay - 1; i >= 0; i--) {
            const dayNum = prevDaysInMonth - i;
            const dayEl = createDayCell(year, month - 1, dayNum, true, holidaySet);
            grid.appendChild(dayEl);
        }

        // 2. 이번 달
        let workoutDaysCount = 0;
        for (let i = 1; i <= daysInMonth; i++) {
            const dayEl = createDayCell(year, month, i, false, holidaySet);
            const dateStr = formatDateStr(year, month + 1, i);
            
            if (workoutData[dateStr]) {
                const data = workoutData[dateStr];
                const hasWorkout = (data.tags && data.tags.length > 0) || (data.workouts && data.workouts.length > 0) || (data.cardios && data.cardios.length > 0);
                if (hasWorkout) workoutDaysCount++;
            }

            grid.appendChild(dayEl);
        }

        // 3. 다음 달 (다음 달 날짜라도 운동 기록 태그 표시 & 투명도 적용)
        const totalCells = grid.children.length - 7;
        const remainingCells = (7 - (totalCells % 7)) % 7;
        for (let i = 1; i <= remainingCells; i++) {
            const dayEl = createDayCell(year, month + 1, i, true, holidaySet);
            grid.appendChild(dayEl);
        }

        const pct = Math.round((workoutDaysCount / daysInMonth) * 100);
        document.getElementById('days-in-month').innerText = `${daysInMonth}일`;
        document.getElementById('workout-days').innerText = `${workoutDaysCount}일`;
        document.getElementById('workout-percent').innerText = `(${pct}%)`;
    }

    function createDayCell(year, monthIndex, dayNum, isOtherMonth, holidaySet) {
        const cellDate = new Date(year, monthIndex, dayNum);
        const cellYear = cellDate.getFullYear();
        const cellMonth = cellDate.getMonth() + 1;
        const cellDay = cellDate.getDate();
        const dayOfWeek = cellDate.getDay();
        const dateStr = formatDateStr(cellYear, cellMonth, cellDay);

        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';
        if (isOtherMonth) dayEl.classList.add('other-month');

        const isHoli = holidaySet.has(dateStr);

        if (dayOfWeek === 0) dayEl.classList.add('is-sunday');
        if (dayOfWeek === 6) dayEl.classList.add('is-saturday');
        if (isHoli) dayEl.classList.add('is-holiday');

        const headerRow = document.createElement('div');
        headerRow.className = 'day-header-row';

        const dayNumSpan = document.createElement('span');
        dayNumSpan.className = 'day-number';
        dayNumSpan.innerText = cellDay;
        headerRow.appendChild(dayNumSpan);

        dayEl.appendChild(headerRow);

        const centerWrapper = document.createElement('div');
        centerWrapper.className = 'day-center-wrapper';

        // 운동 기록 태그 rendering (현재 달/다른 달 모두 적용)
        if (workoutData[dateStr]) {
            const data = workoutData[dateStr];
            const hasTags = data.tags && data.tags.length > 0;
            const hasWorkout = hasTags || (data.workouts && data.workouts.length > 0) || (data.cardios && data.cardios.length > 0);

            if (hasWorkout) {
                dayEl.classList.add('has-workout');
            }

            if (hasTags) {
                const tagOrder = ["PT", "상체", "하체", "유산소"];
                const sortedTags = [...data.tags].sort((a, b) => tagOrder.indexOf(a) - tagOrder.indexOf(b));

                sortedTags.forEach(tag => {
                    const tagSpan = document.createElement('span');
                    let tagClass = 'tag-pt';
                    if (tag === '상체') tagClass = 'tag-upper';
                    else if (tag === '하체') tagClass = 'tag-lower';
                    else if (tag === '유산소') tagClass = 'tag-cardio';
                    
                    tagSpan.className = `tag-pill ${tagClass}`;
                    tagSpan.innerText = tag;
                    centerWrapper.appendChild(tagSpan);
                });
            }
        }

        dayEl.appendChild(centerWrapper);

        // 클릭 시 해당 날짜의 운동 모달 열기 (다른 달 날짜도 바로 수정 및 확인 가능)
        dayEl.onclick = () => openWorkoutModal(cellYear, cellMonth - 1, cellDay);

        return dayEl;
    }

                    if (w.sets) details.push(`${w.sets}세트`);

                    li.innerHTML = `
                        <div class="log-info">

                    list.appendChild(li);

            if (data.cardios && data.cardios.length > 0) {

                    li.innerHTML = `

                        </div>
                        <button class="del-log" onclick="deleteLog('cardio', ${index})">삭제</button>
                    `;

            if (!hasAnyLog) {

    function addInBodyRecord(type) {
        if (type === 'muscle-fat') {
            const date = document.querySelector('.inbody-date-input').value;
            const weightVal = document.querySelector('.inbody-weight-input').value.trim();
            const muscleVal = document.querySelector('.inbody-muscle-input').value.trim();
            const fatVal = document.querySelector('.inbody-fat-input').value.trim();

            const weight = weightVal !== '' ? parseFloat(weightVal) : null;
            const muscle = muscleVal !== '' ? parseFloat(muscleVal) : null;
            const fat = fatVal !== '' ? parseFloat(fatVal) : null;

            if (!date || (weight === null && muscle === null && fat === null)) { 
                alert('날짜와 최소 하나 이상의 수치(예: 체중)를 입력해 주세요.'); 
                return; 
            }

            let rec = inbodyRecords.find(r => r.date === date);
            if (rec) { 
                if (weight !== null) rec.weight = weight;
                if (muscle !== null) rec.muscle = muscle;
                if (fat !== null) rec.fat = fat;
            } else { 
                inbodyRecords.push({ date, weight, muscle, fat }); 
            }
            
            document.querySelector('.inbody-weight-input').value = '';
            document.querySelector('.inbody-muscle-input').value = '';
            document.querySelector('.inbody-fat-input').value = '';
        } else {
            const date = document.querySelector('.inbody-date-input-obesity').value;
            const bmi = parseFloat(document.querySelector('.inbody-bmi-input').value);
            const fatPct = parseFloat(document.querySelector('.inbody-fatpct-input').value);

            if (!date || isNaN(bmi) || isNaN(fatPct)) { alert('BMI와 체지방률을 입력해 주세요.'); return; }

            let rec = inbodyRecords.find(r => r.date === date);
            if (rec) { rec.bmi = bmi; rec.fatPct = fatPct; }
            else { inbodyRecords.push({ date, bmi, fatPct }); }

            document.querySelector('.inbody-bmi-input').value = '';
            document.querySelector('.inbody-fatpct-input').value = '';
        }

        inbodyRecords.sort((a, b) => new Date(a.date) - new Date(b.date));
        saveData();
        updateChart();
    }

        const bmiVal = document.getElementById('edit-bmi').value.trim();
        const fatpctVal = document.getElementById('edit-fatpct').value.trim();

        record.weight = wVal !== '' ? parseFloat(wVal) : null;
        record.muscle = mVal !== '' ? parseFloat(mVal) : null;
        record.fat = fVal !== '' ? parseFloat(fVal) : null;
        record.bmi = bmiVal !== '' ? parseFloat(bmiVal) : null;
        record.fatPct = fatpctVal !== '' ? parseFloat(fatpctVal) : null;

        saveData();
        updateChart();
        closeInbodyEditModal();
    }

    function deleteInbodyEdit() {
        if (selectedInbodyIdx === null) return;
        if (confirm('해당 인바디 기록을 삭제할까요?')) {
            inbodyRecords.splice(selectedInbodyIdx, 1);
            saveData();
            updateChart();
            closeInbodyEditModal();
        }
    }
</script>

</body>
